name: Build and Push ACI Session Worker Image

# Publishes the Azure Confidential ACI variant of the worker image --
# aci/arm-template-dev.json's own `image` parameter points at whatever this
# publishes, by digest (aci/resolve-image-digest.sh resolves it).
# Genuinely single-repo build context now (this repo's own root; nothing
# reaches outside it) -- split out of attested-python-execution (a
# separate, private repo) specifically so this is true: that repo's own
# Cargo dependency on this one's session_protocol crate is a one-way,
# ordinary external dependency, never the reverse. Published public:
# nothing in it is secret, and Azure needs to pull it into the container
# group it launches without a registry credential. GHCR container package
# visibility can't be flipped by this workflow's own GITHUB_TOKEN (needs a
# PAT with repo + write:packages scope, or the GitHub UI) -- set to public
# once, manually, after this workflow's first successful push (package
# Settings -> Change visibility).

on:
  push:
    branches: [ main ]
    paths:
      - 'aci/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/aci-session-worker-build.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/aci-session-worker
  # Fixed value, not `date +%s` at run time: BuildKit's SOURCE_DATE_EPOCH
  # build-arg normalizes image-config `created` and layer timestamps to
  # this instead of each run's own wall clock, which is what actually
  # lets two builds from identical source converge on the same digest --
  # same pin extra/build-attest-api/Dockerfile uses in
  # directionallyai/linuxkit-attestable-ami.
  SOURCE_DATE_EPOCH: "1788613323"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Loaded locally (not pushed yet) so the next step can actually run
      # it -- catches exactly the regression this workflow once shipped
      # silently (attested-python-execution's own git history, before
      # this repo existed): aci/Dockerfile's own two-pass build (a
      # dummy-binary pass to cache dependencies, then the real one
      # compiling src/) can drift out of sync on which --features get
      # passed to each pass. Since session_master.rs's build variant is a
      # compile-time #[cfg(feature = "aci-attestation")] choice (not a
      # runtime check), nothing at deploy time could catch a mismatch --
      # only actually running the built binary can.
      # `outputs:` (raw buildx syntax), not the action's own `tags:`/`push:`/
      # `load:` inputs: confirmed live, this session, that SOURCE_DATE_EPOCH
      # alone normalizes the image config's own `created` field but NOT
      # individual file mtimes inside a layer for either the `docker` or
      # `image` exporter -- apt-installed files still carried each run's
      # own near-wall-clock mtime even with the build-arg set, which is
      # why an otherwise-identical build on a different machine produced a
      # different layer digest despite the compiled binary inside being
      # byte-for-byte identical (directionallyai/github-to-private-key,
      # same investigation). `rewrite-timestamp=true` -- the same option
      # extra/build-attest-api/build-deterministic.sh's own OCI-tar export
      # already uses in directionallyai/linuxkit-attestable-ami -- fixes
      # it; it just isn't reachable through this action's simple inputs.
      - name: Build image (local, for verification)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: aci/Dockerfile
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=docker,name=aci-session-worker:verify,rewrite-timestamp=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs the real compiled binary and checks for the log line only
      # main()'s aci-attestation branch prints (see session_master.rs).
      # ACI_CALLBACK_ADDR/_TOKEN are deliberately left unset -- this
      # container is expected to log that line and then fail fast on
      # them being missing; only the log line itself is being checked,
      # not a full session. `|| true` on the run so that expected
      # failure doesn't fail this step before the grep gets to run.
      - name: Verify the image built the aci-attestation variant
        run: |
          set -e
          output=$(timeout 30s docker run --rm aci-session-worker:verify 2>&1 || true)
          echo "$output"
          if ! echo "$output" | grep -q "session-master (aci-attestation build) starting"; then
            echo "::error::Built image never logged the aci-attestation startup line -- it was very likely compiled without --features aci-attestation (check aci/Dockerfile's two cargo build passes agree). Refusing to push a Lambda-variant binary under the ACI image tag."
            exit 1
          fi

      # `outputs:` name= accepts a comma-separated list for multiple tags in
      # one push, quoted so buildx doesn't mistake the tag-list commas for
      # the outer type=image,name=...,push=...  key separators -- confirmed
      # live this session that this exact form parses and pushes both tags.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: aci/Dockerfile
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: 'type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}",push=true,rewrite-timestamp=true'
          cache-from: type=gha
          cache-to: type=gha,mode=max
